name: COPG-VD

# The version lives in module/module.prop and nowhere else. .github/scripts/version.sh
# bumps it, derives versionCode and rewrites module/update.json, so no string is ever
# typed into this file.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'version bump'
        type: choice
        options: [none, patch, minor, major]
        default: none
      release:
        description: 'publish a GitHub release with the zip'
        type: boolean
        default: false
      notes:
        description: 'changelog lines for this version (used by the automatic fingerprint release)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: copg-vd-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Upstream pins an `environment: COPG-VD` here, which gates the job on an
    # environment that only exists in that repository; on a fork the job would
    # sit waiting for approval. Nothing in this workflow needs environment
    # secrets - the token is the workflow token - so it is simply not used.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          elif [ -d "$ANDROID_HOME/cmdline-tools/tools" ]; then
            mv $ANDROID_HOME/cmdline-tools/tools $ANDROID_HOME/cmdline-tools/latest
          else
            echo "Unexpected directory structure after unzip:"
            ls -la $ANDROID_HOME/cmdline-tools
            exit 1
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.1"
          mkdir -p $ANDROID_HOME/ndk
          wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $ANDROID_HOME/ndk
          NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d -name "android-ndk-r29*" | head -n 1)
          echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get purge -y man-db 2>/dev/null || true
          sudo rm -rf /var/cache/man /var/lib/man-db /usr/share/man 2>/dev/null || true
          echo 'DPkg::Post-Invoke { ":"; };' | sudo tee /etc/apt/apt.conf.d/99noman >/dev/null
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zip curl

      # One .so per ABI, named the way Zygisk loads them: zygisk/<abi>.so.
      # Plain cmake instead of a third-party action: one less thing to trust in a build that
      # produces a library loaded into zygote.
      - name: Build zygisk libraries
        env:
          ABIS: arm64-v8a armeabi-v7a x86_64
        run: |
          for abi in $ABIS; do
            echo "::group::$abi"
            start=$(date -u +%s)
            cmake -S zygisk -B "zygisk/build/$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" \
              -DANDROID_PLATFORM=android-28 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_MAKE_PROGRAM=/usr/bin/make
            cmake --build "zygisk/build/$abi" --parallel "$(nproc)"
            if [ ! -f "zygisk/build/$abi/libspoof.so" ]; then
              echo "::error::$abi library not built"
              ls -la "zygisk/build/$abi"
              exit 1
            fi
            echo "$abi built in $(( $(date -u +%s) - start ))s: $(stat -c %s "zygisk/build/$abi/libspoof.so") bytes"
            echo "::endgroup::"
          done

      - name: Resolve version
        id: version
        run: .github/scripts/version.sh "${{ inputs.bump == 'none' && 'read' || inputs.bump }}"

      # The automatic fingerprint release has no hand-written CHANGELOG section, so it brings
      # its own lines: they become the section for this version (kept in the file, committed
      # with the bump) and therefore also the release notes.
      - name: Changelog section from notes
        if: steps.version.outputs.bumped == 'true' && inputs.notes != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          grep -q "^## $VERSION\$" CHANGELOG.md && { echo "section already there"; exit 0; }
          {
            sed -n '1,2p' CHANGELOG.md
            printf '## %s\n%s\n\n' "$VERSION" "$NOTES"
            sed -n '3,$p' CHANGELOG.md
          } > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          sed -n '1,8p' CHANGELOG.md

      # One script builds the staging tree and the zip, so CI and a local run
      # cannot drift. It also fails if a file the runtime needs is missing from
      # the archive (identity.sh, both dex helpers, all three .so files).
      - name: Build the release zip
        run: bash .github/scripts/build-release.sh --skip-tests

      - name: Commit the bump
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add module/module.prop module/update.json CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.version }} (versionCode ${{ steps.version.outputs.version_code }})"
          git push

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: COPG-VD-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.zip_name }}

      - name: Publish release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes come from this version's section of the CHANGELOG when it has one.
          notes=$(awk -v v="## $VERSION" '
              $0 ~ "^"v { found = 1; next }
              found && /^## / { exit }
              found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
              echo "::warning::no CHANGELOG section for $VERSION"
              notes="See the commit history for the changes in this version."
          fi
          # Every release carries the channel banner (same footer applied by hand to the
          # manual releases), so automatic fingerprint releases get it too.
          # sha256 of the zip and each shipped .so, published so anyone can verify the bytes.
          sha256sum "${{ steps.version.outputs.zip_name }}" > SHA256SUMS.txt
          ( cd module/zygisk && sha256sum *.so ) >> SHA256SUMS.txt
          {
            printf '%s\n' "$notes"
            printf '\n### Checksums (sha256)\n\n'
            printf '```\n'
            cat SHA256SUMS.txt
            printf '```\n'
            printf '\n---\n'
            printf '%s\n' "📣 **Join the channel for updates:** @Priv8_VD https://t.me/Priv8_VD"
          } > release-notes.md
          # Tag the commit that produced these bytes, then attach the release to
          # it. The tag is created first so a release can never exist without one;
          # a pre-existing tag is reused, which makes a re-run of this workflow
          # idempotent instead of an error.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
              echo "tag ${VERSION} already exists"
          else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                  -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}" >/dev/null
              echo "tagged ${GITHUB_SHA:0:7} as ${VERSION}"
          fi
          gh release create "$VERSION" "${{ steps.version.outputs.zip_name }}" SHA256SUMS.txt \
            --title "$VERSION" --notes-file release-notes.md --verify-tag
          # module/update.json already points at this asset, so the in-app updater works
          # the moment the release exists.

      - name: Summary
        if: always()
        run: |
          {
            echo "### COPG-VD ${{ steps.version.outputs.version }}"
            echo ''
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | ${{ steps.version.outputs.version }} |"
            echo "| versionCode | ${{ steps.version.outputs.version_code }} |"
            echo "| bumped | ${{ steps.version.outputs.bumped }} |"
            echo "| released | ${{ inputs.release }} |"
          } >> "$GITHUB_STEP_SUMMARY"
